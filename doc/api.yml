openapi: 3.0.3
info:
  title: PlatformE API
  description: |
    REST API for the PlatformE commerce platform.

    It exposes public product browsing and checkout, an admin area for
    product/order management, and generated health-check endpoints.

    ### Authentication
    Admin endpoints (`/admin/**`) are protected with **HTTP Basic**
    authentication and require the `ADMIN` role.

    All other endpoints are public.
  version: 1.0.0
  contact:
    name: sombiniaina
    email: sombiniaina@example.com
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Health
    description: Service health checks
  - name: Products
    description: Public product catalog
  - name: Checkout
    description: Customer ordering
  - name: Admin - Products
    description: Product administration
  - name: Admin - Orders
    description: Order administration
  - name: Admin - Inventory
    description: Inventory administration
security:
  - basicAuth: []
paths:
  /ping:
    get:
      tags: [Health]
      summary: Ping the service
      operationId: ping
      security: []
      responses:
        '200':
          description: Service is alive
          content:
            text/plain:
              schema:
                type: string
                example: pong
  /health/db:
    get:
      tags: [Health]
      summary: Check database connectivity
      description: Returns `OK` when the dummy table is not empty, `KO` otherwise.
      operationId: healthDb
      security: []
      responses:
        '200':
          description: Database is reachable
          content:
            text/plain:
              schema:
                type: string
                example: OK
        '500':
          description: Database is not reachable or the dummy table is empty
          content:
            text/plain:
              schema:
                type: string
                example: KO
  /health/bucket:
    get:
      tags: [Health]
      summary: Check file bucket connectivity
      description: Uploads, downloads and presigns a temporary file, then returns the presigned URL.
      operationId: healthBucket
      security: []
      responses:
        '200':
          description: Bucket is healthy
          content:
            text/plain:
              schema:
                type: string
                format: uri
  /health/email:
    get:
      tags: [Health]
      summary: Send health-check emails
      operationId: healthEmail
      security: []
      parameters:
        - name: to
          in: query
          required: true
          description: Recipient email address
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Emails were accepted for delivery
          content:
            text/plain:
              schema:
                type: string
                example: OK
  /products:
    get:
      tags: [Products]
      summary: List products
      description: Returns a paginated, optionally keyword-filtered product list.
      operationId: getAllProducts
      security: []
      parameters:
        - name: keyword
          in: query
          required: false
          description: Case-insensitive substring matched against the product name.
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Zero-based page index.
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          description: Number of items per page.
          schema:
            type: integer
            format: int32
            default: 10
            minimum: 1
      responses:
        '200':
          description: A list of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
  /products/new-arrivals:
    get:
      tags: [Products]
      summary: List new arrivals
      description: Returns products created within the last seven days.
      operationId: getNewArrivals
      security: []
      responses:
        '200':
          description: A list of recently created products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
  /orders/checkout:
    post:
      tags: [Checkout]
      summary: Checkout a shopping cart
      description: Creates a new PENDING order and decrements product stock.
      operationId: checkout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/products:
    post:
      tags: [Admin - Products]
      summary: Create a product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/products/{id}:
    put:
      tags: [Admin - Products]
      summary: Update a product
      operationId: updateProduct
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin - Products]
      summary: Delete a product
      operationId: deleteProduct
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '204':
          description: Product deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/products/{id}/restock:
    put:
      tags: [Admin - Inventory]
      summary: Restock and revalue a product
      description: |
        Adds stock and sets a new base price. When more than 100 units are
        added, a 10% discount is applied to the base price.
      operationId: restockProduct
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - name: addedQuantity
          in: query
          required: true
          description: Quantity to add to the current stock (must be positive).
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: newBasePrice
          in: query
          required: true
          description: New base price of the product (must be positive).
          schema:
            type: number
            minimum: 0
            exclusiveMinimum: true
      responses:
        '200':
          description: Product restocked and revalued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/orders:
    get:
      tags: [Admin - Orders]
      summary: List orders by customer email
      operationId: getOrdersByCustomer
      parameters:
        - name: email
          in: query
          required: true
          description: Customer email address.
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Orders placed by the customer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/orders/{id}/cancel:
    put:
      tags: [Admin - Orders]
      summary: Cancel an order
      description: Cancels the order and restores the stock of its lines.
      operationId: cancelOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/orders/{id}/pay:
    put:
      tags: [Admin - Orders]
      summary: Mark an order as paid
      description: Allowed only when the order status is `PENDING`.
      operationId: payOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order marked as paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/orders/{id}/ship:
    put:
      tags: [Admin - Orders]
      summary: Mark an order as shipped
      description: Allowed only when the order status is `PAID`.
      operationId: shipOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order marked as shipped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      description: Product identifier.
      schema:
        type: string
        format: uuid
    OrderId:
      name: id
      in: path
      required: true
      description: Order identifier.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request payload or parameters
      content:
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: Missing or invalid credentials
    NotFound:
      description: The requested resource was not found
      content:
        text/plain:
          schema:
            type: string
    Conflict:
      description: The request conflicts with the current resource state
      content:
        text/plain:
          schema:
            type: string
    ServerError:
      description: Unexpected server error
      content:
        text/plain:
          schema:
            type: string
  schemas:
    Product:
      type: object
      required:
        - id
        - name
        - price
        - stockQuantity
        - creationDate
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Wireless Mouse
        price:
          type: number
          example: 29.99
        stockQuantity:
          type: integer
          format: int64
          example: 120
        creationDate:
          type: string
          format: date-time
    Order:
      type: object
      required:
        - id
        - customerEmail
        - totalPrice
        - orderDate
        - status
      properties:
        id:
          type: string
          format: uuid
        customerEmail:
          type: string
          format: email
        totalPrice:
          type: number
          example: 59.98
        orderDate:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        status:
          $ref: '#/components/schemas/OrderStatus'
    OrderLine:
      type: object
      required:
        - id
        - quantity
        - unitPrice
        - productId
        - productName
      properties:
        id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          example: 2
        unitPrice:
          type: number
          example: 29.99
        productId:
          type: string
          format: uuid
        productName:
          type: string
          example: Wireless Mouse
    OrderStatus:
      type: string
      enum:
        - PENDING
        - PAID
        - SHIPPED
        - CANCELLED
    ProductCreateRequest:
      type: object
      required:
        - name
        - price
        - stockQuantity
      properties:
        name:
          type: string
          minLength: 1
        price:
          type: number
          exclusiveMinimum: true
          minimum: 0
        stockQuantity:
          type: integer
          format: int64
          minimum: 1
    ProductUpdateRequest:
      type: object
      required:
        - name
        - price
        - quantity
      properties:
        name:
          type: string
          minLength: 1
        price:
          type: number
          exclusiveMinimum: true
          minimum: 0
        quantity:
          type: integer
          format: int64
          minimum: 1
    CheckoutRequest:
      type: object
      required:
        - customerEmail
        - items
      properties:
        customerEmail:
          type: string
          format: email
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProductOrderRequest'
    ProductOrderRequest:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1
